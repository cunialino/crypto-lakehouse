[package]
name = "crypto-batcher"
version = "0.1.0"
edition = "2024"
description = "Micro-batches NATS JetStream trade events into Iceberg (sole writer of trades.trades)"

[dependencies]
anyhow = "1.0.102"
arrow-array = "58"
arrow-schema = "58"
async-nats = "0.49.0"
clap = { version = "4.6.7", features = ["derive"] }
crypto-data = { version = "0.1.0", path = "../crypto-data" }
datafusion = "55.0"
futures = "0.3"
iceberg = "0.10.1"
iceberg-catalog-rest = "0.10.1"
iceberg-datafusion = "0.10.1"
iceberg-storage-opendal = { version = "0.10.1", features = ["opendal-s3"] }
parquet = { version = "58", features = ["async", "zstd"] }
prost = "0.14.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }
