[package]
name = "crypto-collector"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures = "0.3"
anyhow = "1.0.100"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
bytes = "1.10.1"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
prost = "0.14.1"
rdkafka = { version = "0.39.0", features = ["tokio"] }

[build-dependencies]
prost-build = "0.14.1"
