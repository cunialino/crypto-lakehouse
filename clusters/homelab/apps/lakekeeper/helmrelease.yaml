apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lakekeeper
  namespace: lakekeeper
spec:
  interval: 1h
  timeout: 10m
  # Argo rendered this chart under the Application name, and every object name in the chart derives
  # from it. Pinning is what makes the first install adopt the live objects instead of creating a
  # parallel lakekeeper-lakekeeper-* set beside them.
  releaseName: lakekeeper
  chart:
    spec:
      chart: lakekeeper
      # pinned, never a semver range: Renovate's flux manager bumps this field and nothing else
      version: 0.14.0
      sourceRef:
        kind: HelmRepository
        name: lakekeeper
        namespace: lakekeeper
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  # The chart writes a random lakekeeper-postgres-encryption Secret only when
  # secretBackend.postgres.encryptionKeySecret is empty. It is set below, so the chart never touches
  # that Secret and secret-pg-encryption-key.yaml in this directory is its only copy in Git. Losing
  # it makes the catalog's already-encrypted columns unreadable.
  values:
    postgresql:
      enabled: false
    secretBackend:
      type: postgres
      postgres:
        encryptionKeySecret: lakekeeper-pg-encryption-key
        encryptionKeySecretKey: encryptionKey
    externalDatabase:
      host_read: pg-cluster-ro.cnpg-system.svc.cluster.local
      host_write: pg-cluster-rw.cnpg-system.svc.cluster.local
      database: lakekeeper
      user: "lakekeeper"
      passwordSecret: "lakekeeper-secret"
      passwordSecretKey: "PGPASSWORD"
    catalog:
      extraEnv:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: lakekeeper-secret
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: lakekeeper-secret
              key: AWS_SECRET_ACCESS_KEY
        - name: LAKEKEEPER__ENABLE_AWS_SYSTEM_CREDENTIALS
          value: "true"
        - name: LAKEKEEPER__S3_ENABLE_DIRECT_SYSTEM_CREDENTIALS
          value: "true"
        - name: LAKEKEEPER__S3_REQUIRE_EXTERNAL_ID_FOR_SYSTEM_CREDENTIALS
          value: "false"
