apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # The AutoscalingRunnerSet is named homelab-runner-crypto; this object is named after it, and the
  # Helm release has to be named after the runnerScaleSetName (see releaseName below).
  name: arc-scale-set-crypto
  namespace: arc-runners
spec:
  interval: 1h
  timeout: 5m
  # Every object this chart produces is named from runnerScaleSetName
  # (homelab-runner-crypto-gha-rs-manager, -gha-rs-kube-mode, ...), so the release name has to match
  # it exactly or take-ownership would create a second set of objects next to the live ones.
  releaseName: homelab-runner-crypto
  chart:
    spec:
      chart: gha-runner-scale-set
      # pinned, never a semver range
      version: 0.14.2
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller-charts
        # Shared with homelab's ARC controller and homelab-runner scale set: same namespace, same OCI
        # index, one source object for all three releases. It is created by homelab's arc-runners
        # layer, which this Kustomization dependsOn, and the controllerServiceAccount below and the
        # githubConfigSecret in values both belong to that same install.
        namespace: arc-runners
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    githubConfigUrl: "https://github.com/cunialino/crypto-lakehouse"
    githubConfigSecret: arc-runner-auth
    runnerScaleSetName: "homelab-runner-crypto"
    containerMode:
      type: "kubernetes"
      kubernetesModeWorkVolumeClaim:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "longhorn"
        resources:
          requests:
            storage: "2Gi"

    listenerTemplate:
      spec:
        containers:
          - name: listener
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "200m"
                memory: "256Mi"

    template:
      spec:
        hostUsers: false
        securityContext:
          fsGroup: 1000
          runAsUser: 1000
          runAsGroup: 1000

        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            command: ["/home/runner/run.sh"]

            resources:
              requests:
                cpu: "500m"
                memory: "512Mi"
              limits:
                cpu: "1000m"
                memory: "1Gi"
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              capabilities:
                add: ["SETFCAP"]

            volumeMounts:
                - name: storage
                  mountPath: /storage
        volumes:
            - name: storage
              emptyDir:
                sizeLimit: 2Gi

    controllerServiceAccount:
      name: arc-runners-gha-rs-controller
      namespace: arc-runners
