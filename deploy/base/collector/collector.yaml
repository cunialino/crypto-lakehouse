# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.3/deployment.json

apiVersion: apps/v1
kind: Deployment
metadata:
  name: binance-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: binance-collector
  template:
    metadata:
      labels:
        app: binance-collector
    spec:
      tolerations:
        - key: "opi"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: binance-collector
          image: custom.io/crypto-collector:v0.2.3
          imagePullPolicy: Always
          env:
            - name: NATS_URL
              value: nats://nats-cluster.nats.svc.cluster.local:4222
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "128Gi"
