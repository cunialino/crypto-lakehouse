apiVersion: batch/v1
kind: Job
metadata:
  name: arroyo-register
  namespace: arroyo
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Register runs as a Sync hook on every arroyo-app sync and is idempotent
    # (validate + create-if-absent; no drift => no-op). When git SQL/schema
    # drifts from what is already registered, the drifted pipeline is
    # stop -> delete -> recreated (full JetStream replay). A change to a sql/*.sql
    # or proto/trade_event.proto therefore deploys with a single push. Broken
    # artifacts fail validate_query/schemas-test before any recreate happens.
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "false"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /pipelines/register.sh
          env:
            - name: ARROYO_API
              value: "http://arroyo:80"
            - name: ARROYO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arroyo-api-key
                  key: api-key
            - name: NATS_URL
              value: "nats-cluster.nats.svc.cluster.local:4222"
            - name: LAKEKEEPER_URL
              value: "http://lakekeeper.lakekeeper.svc.cluster.local:8181/catalog"
          volumeMounts:
            - name: pipelines
              mountPath: /pipelines
      volumes:
        - name: pipelines
          configMap:
            # Generated by kustomize configMapGenerator (arroyo-pipelines); the
            # hash-suffixed name is rewritten in by kustomize.
            name: arroyo-pipelines
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
