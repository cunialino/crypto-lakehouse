apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arroyo-metastore-secret
  namespace: arroyo
spec:
  refreshInterval: 10s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: arroyo-metastore-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "arroyo"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "c2819f29-de3f-4b10-bd81-b3e7015fee88"