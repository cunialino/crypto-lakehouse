apiVersion: batch/v1
kind: CronJob
metadata:
  name: risingwave-backup
  namespace: risingwave
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 300
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: backup
            image: docker.risingwave.com/risingwavelabs/risingwave:v3.0.0
            command:
            - ./risingwave/bin/risingwave
            - ctl
            - meta
            - backup-meta
            env:
            - name: RW_META_ADDR
              value: "http://risingwave-meta-headless.risingwave.svc.cluster.local:5690"
            resources:
              requests:
                cpu: "100m"
                memory: "64Mi"
              limits:
                cpu: "200m"
                memory: "128Mi"
