apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-s3-credentials
  namespace: crypto-batcher
spec:
  refreshInterval: 10s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: garage-s3-credentials
    creationPolicy: Owner
    template:
      data:
        # Names must match crypto-batcher's config (`GARAGE_ACCESS_KEY` / `GARAGE_SECRET_KEY`).
        GARAGE_ACCESS_KEY: "{{ .id }}"
        GARAGE_SECRET_KEY: "{{ .key }}"
  # Same bitwarden items the Arroyo namespace mirrors as `rustfs-secret`
  # (deploy/base/arroyo/rustfs_secret.yaml), i.e. the Garage admin S3 key.
  data:
    - secretKey: key
      remoteRef:
        key: "01c16d85-1a29-4581-b417-b416016a58fa"
    - secretKey: id
      remoteRef:
        key: "05c2c173-3de5-4727-80a5-b416016a3c73"
