apiVersion: batch/v1
kind: CronJob
metadata:
  name: table-maintenance
  namespace: lakekeeper
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      backoffLimit: 5
      template:
        spec:
          restartPolicy: "OnFailure"
          containers:
          - name: spark-maintenance
            image: custom.io/spark:s0.1.4
            imagePullPolicy: IfNotPresent
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: lakekeeper-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lakekeeper-secret
                  key: AWS_SECRET_ACCESS_KEY
            resources:
              requests:
                memory: "4Gi"
              limits:
                memory: "4Gi"
