apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lakekeeper
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: "https://github.com/cunialino/crypto-lakehouse.git"
      targetRevision: main
      path: deploy/base/lakekeeper
      ref: myrepo
    - repoURL: https://lakekeeper.github.io/lakekeeper-charts
      chart: lakekeeper
      targetRevision: "0.11.0"
      helm:
        valuesObject:
          postgresql:
            enabled: false
          externalDatabase:
            host_read: pg-cluster-ro.cnpg-system.svc.cluster.local
            host_write: pg-cluster-rw.cnpg-system.svc.cluster.local
            database: lakekeeper
            user: "lakekeeper"
            passwordSecret: "lakekeeper-secret"
            passwordSecretKey: "PGPASSWORD"
  destination:
    server: https://kubernetes.default.svc
    namespace: lakekeeper
  syncPolicy:
    automated:
      enabled: false
    syncOptions:
      - CreateNamespace=true
