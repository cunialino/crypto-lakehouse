# Throwaway overlay for validating the Rust batcher from feature/rust_batcher.
#
# It differs from deploy/base/batcher (prod intent) on purpose: its own namespace
# crypto-batcher-test, so teardown is deleting the namespace; a pinned image tag
# instead of the mutable :latest; and a scratch table plus scratch durable consumer, so the
# run cannot touch Arroyo's `trades.trades_2` nor the offset the eventual prod consumer
# (`iceberg-batcher`) would start from.
#
# Applied by hand through deploy/apps-test/crypto-lakehouse-batcher-test.yaml: the
# deploy/apps app-of-apps tracks main, so it neither syncs nor prunes this one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crypto-batcher-test

resources:
  - ../../base/batcher

images:
  - name: custom.io/crypto-batcher
    newTag: vtest-batcher-3

labels:
  - pairs:
      app.kubernetes.io/managed-by-test: batcher-test
    includeSelectors: false

patches:
  - path: batcher-config-patch.yaml
