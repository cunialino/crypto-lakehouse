apiVersion: v1
kind: ConfigMap
metadata:
  name: batcher-config
data:
  # Scratch table: never `trades_2` (Arroyo/prod) and never `trades_rust` (the intended
  # cutover target). Drop it via Lakekeeper when the test is over.
  ICEBERG_TABLE: "trades_rust_test"
  # Scratch durable consumer. The consumer *is* the offset, and it is created with
  # DeliverPolicy::All, so this run replays the whole tradesstream retention window
  # (~72 h) into the scratch table. Deleting this consumer after the test leaves the
  # prod-name consumer untouched for a clean first run later.
  BATCHER_CONSUMER: "iceberg-batcher-test"
